name: Android CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tools/deployment/tests -v
      - run: bash -n tools/deployment/install-ubuntu.sh
      - run: python3 tools/deployment/bundle.py --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: |
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"
          python3 tools/deployment/publish-update.py $(python3 -c 'import json; print(json.load(open("downloads/update.json"))["version"])') --check
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug ktlintCheck
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-apk-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/reports/
